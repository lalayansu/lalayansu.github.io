<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCA Simulator • BTC • ETH • SOL • DOGE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system_ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-8">
    <div class="flex justify-between items-center mb-10">
      <div>
        <h1 class="text-4xl font-semibold tracking-tight">DCA Simulator</h1>
        <p class="text-zinc-400 mt-1">Test any crypto, any period, any daily amount</p>
      </div>
      <a href="https://github.com/YOUR-USERNAME/YOUR-REPO" target="_blank"
         class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors">
        <span class="text-sm">⭐ Star on GitHub</span>
      </a>
    </div>

    <!-- Form -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 mb-10">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div>
          <label class="block text-zinc-400 text-sm font-medium mb-2">Asset</label>
          <select id="asset" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
            <option value="bitcoin">Bitcoin (BTC)</option>
            <option value="ethereum">Ethereum (ETH)</option>
            <option value="solana">Solana (SOL)</option>
            <option value="dogecoin">Dogecoin (DOGE)</option>
            <option value="cardano">Cardano (ADA)</option>
            <option value="ripple">XRP (XRP)</option>
          </select>
        </div>

        <div>
          <label class="block text-zinc-400 text-sm font-medium mb-2">Daily Amount ($)</label>
          <input id="dailyAmount" type="number" value="25" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-zinc-400 text-sm font-medium mb-2">Start Date</label>
          <input id="startDate" type="date" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-zinc-400 text-sm font-medium mb-2">End Date</label>
          <input id="endDate" type="date" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div class="flex gap-4 mt-8">
        <button onclick="runSimulation()" 
                class="flex-1 bg-white text-zinc-900 hover:bg-zinc-100 font-semibold py-4 rounded-3xl text-lg transition-all">
          🚀 Run Simulation
        </button>
        <button onclick="setDefault200Days()" 
                class="px-8 border border-zinc-700 hover:border-zinc-400 font-medium rounded-3xl transition-all">
          Use 200 Days
        </button>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-3 bg-zinc-900 border border-zinc-800 rounded-3xl p-8">
          <h2 class="text-2xl font-semibold mb-6" id="assetName"></h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="bg-zinc-800 rounded-2xl p-6">
              <p class="text-zinc-400 text-sm">Total Invested</p>
              <p id="totalInvested" class="text-3xl font-semibold mt-2"></p>
            </div>
            <div class="bg-zinc-800 rounded-2xl p-6">
              <p class="text-zinc-400 text-sm">Coins Bought</p>
              <p id="totalCoins" class="text-3xl font-semibold mt-2"></p>
            </div>
            <div class="bg-zinc-800 rounded-2xl p-6">
              <p class="text-zinc-400 text-sm">Value at End of DCA</p>
              <p id="valueAtEnd" class="text-3xl font-semibold mt-2"></p>
              <p id="roiAtEnd" class="text-sm mt-1"></p>
            </div>
            <div class="bg-zinc-800 rounded-2xl p-6">
              <p class="text-zinc-400 text-sm">Value Today</p>
              <p id="valueToday" class="text-3xl font-semibold mt-2"></p>
              <p id="roiToday" class="text-sm mt-1"></p>
            </div>
          </div>
        </div>

        <div class="lg:col-span-2 bg-zinc-900 border border-zinc-800 rounded-3xl p-8">
          <h3 class="font-semibold mb-4">Portfolio Value After Holding</h3>
          <table class="w-full" id="holdTable">
            <thead>
              <tr class="border-b border-zinc-700">
                <th class="text-left py-3 text-zinc-400">Hold Period</th>
                <th class="text-right py-3 text-zinc-400">Date</th>
                <th class="text-right py-3 text-zinc-400">Value</th>
                <th class="text-right py-3 text-zinc-400">ROI</th>
              </tr>
            </thead>
            <tbody id="holdBody" class="text-sm"></tbody>
          </table>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8">
          <h3 class="font-semibold mb-4">Portfolio Value Over Time</h3>
          <canvas id="valueChart" class="w-full h-80"></canvas>
        </div>
      </div>
    </div>

    <div id="loading" class="hidden text-center py-12 text-zinc-400">
      Fetching historical prices from CoinGecko...
    </div>
  </div>

  <script>
    tailwind.config = { content: ["./**/*.{html,js}"] };
    let chartInstance = null;

    async function getCoinData(coinId, fromTimestamp, toTimestamp) {
      const url = `https://api.coingecko.com/api/v3/coins/${coinId}/market_chart/range?vs_currency=usd&from=${fromTimestamp}&to=${toTimestamp}&precision=2`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Failed to fetch");
      const data = await res.json();
      const priceMap = new Map();
      data.prices.forEach(([ts, price]) => {
        const date = new Date(ts).toISOString().split('T')[0];
        priceMap.set(date, price);
      });
      return priceMap;
    }

    function getClosestPrice(priceMap, targetDate) {
      const dates = Array.from(priceMap.keys()).sort();
      let closest = dates[0];
      for (let date of dates) {
        if (date <= targetDate) closest = date;
        else break;
      }
      return priceMap.get(closest);
    }

    async function runSimulation() {
      const assetSelect = document.getElementById('asset');
      const coinId = assetSelect.value;
      const assetName = assetSelect.options[assetSelect.selectedIndex].text;
      const dailyAmount = parseFloat(document.getElementById('dailyAmount').value) || 25;
      const startDateStr = document.getElementById('startDate').value;
      const endDateStr = document.getElementById('endDate').value;

      if (!startDateStr || !endDateStr) return alert("Please select start and end dates");

      const startDate = new Date(startDateStr);
      const endDate = new Date(endDateStr);
      if (startDate > endDate) return alert("Start date must be before end date");

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');

      try {
        const today = new Date();
        const fromTs = Math.floor(startDate.getTime() / 1000);
        const toTs = Math.floor(today.getTime() / 1000);

        const priceMap = await getCoinData(coinId, fromTs, toTs);

        let totalInvested = 0;
        let totalCoins = 0;
        let current = new Date(startDate);
        while (current <= endDate) {
          const dateStr = current.toISOString().split('T')[0];
          const price = priceMap.get(dateStr) || getClosestPrice(priceMap, dateStr);
          if (price) {
            totalCoins += dailyAmount / price;
            totalInvested += dailyAmount;
          }
          current.setDate(current.getDate() + 1);
        }

        const endDateKey = endDate.toISOString().split('T')[0];
        const priceAtEnd = getClosestPrice(priceMap, endDateKey);
        const valueAtEndDCA = totalCoins * priceAtEnd;

        const todayStr = today.toISOString().split('T')[0];
        const valueToday = totalCoins * getClosestPrice(priceMap, todayStr);

        // Fill summary
        document.getElementById('assetName').textContent = assetName;
        document.getElementById('totalInvested').textContent = `$${totalInvested.toLocaleString()}`;
        document.getElementById('totalCoins').innerHTML = `${totalCoins.toFixed(6)} <span class="text-sm text-zinc-400">${assetName.split(' ')[0]}</span>`;
        document.getElementById('valueAtEnd').textContent = `$${(valueAtEndDCA).toLocaleString()}`;
        document.getElementById('roiAtEnd').innerHTML = `<span class="${((valueAtEndDCA - totalInvested)/totalInvested*100 >= 0 ? 'text-green-400' : 'text-red-400')}">${(((valueAtEndDCA - totalInvested)/totalInvested*100).toFixed(1))}%</span>`;
        document.getElementById('valueToday').textContent = `$${(valueToday).toLocaleString()}`;
        document.getElementById('roiToday').innerHTML = `<span class="${((valueToday - totalInvested)/totalInvested*100 >= 0 ? 'text-green-400' : 'text-red-400')}">${(((valueToday - totalInvested)/totalInvested*100).toFixed(1))}%</span>`;

        // Hold table + chart
        const tableBody = document.getElementById('holdBody');
        tableBody.innerHTML = '';
        const chartDates = [];
        const chartValues = [];

        const holdLabels = ["End of DCA"];
        const holdDates = [endDateKey];

        for (let y = 1; y <= 4; y++) {
          const target = new Date(endDate);
          target.setFullYear(target.getFullYear() + y);
          if (target > today) break;
          holdDates.push(target.toISOString().split('T')[0]);
          holdLabels.push(`+${y} year${y > 1 ? 's' : ''}`);
        }
        holdDates.push(todayStr);
        holdLabels.push("Today");

        holdDates.forEach((dateStr, i) => {
          const price = getClosestPrice(priceMap, dateStr);
          const value = totalCoins * price;
          const roi = ((value - totalInvested) / totalInvested) * 100;

          const row = document.createElement('tr');
          row.className = 'border-b border-zinc-700 last:border-none';
          row.innerHTML = `
            <td class="py-4">${holdLabels[i]}</td>
            <td class="text-right py-4">${dateStr}</td>
            <td class="text-right py-4 font-semibold">$${value.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
            <td class="text-right py-4 ${roi >= 0 ? 'text-green-400' : 'text-red-400'}">${roi.toFixed(1)}%</td>
          `;
          tableBody.appendChild(row);

          chartDates.push(dateStr);
          chartValues.push(value);
        });

        // Chart
        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('valueChart').getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: chartDates,
            datasets: [{
              label: 'Portfolio Value ($)',
              data: chartValues,
              borderColor: '#22c55e',
              backgroundColor: 'rgba(134, 239, 172, 0.1)',
              borderWidth: 3,
              tension: 0.3,
              pointRadius: 0
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#27272a' }, ticks: { color: '#a3a3a3' } },
              x: { grid: { color: '#27272a' }, ticks: { color: '#a3a3a3', maxRotation: 45 } }
            }
          }
        });

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('results').classList.remove('hidden');

      } catch (e) {
        alert("Could not fetch price data. Please try again.");
        console.error(e);
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function setDefault200Days() {
      const today = new Date();
      const end = new Date(today);
      const start = new Date(end);
      start.setDate(start.getDate() - 200);
      document.getElementById('startDate').value = start.toISOString().split('T')[0];
      document.getElementById('endDate').value = end.toISOString().split('T')[0];
      document.getElementById('dailyAmount').value = 25;
      runSimulation();
    }

    window.onload = () => {
      const today = new Date();
      const end = today.toISOString().split('T')[0];
      const start = new Date(today);
      start.setDate(start.getDate() - 200);
      document.getElementById('startDate').value = start.toISOString().split('T')[0];
      document.getElementById('endDate').value = end;
    };
  </script>
</body>
</html>
